name: Sync Dataset to Hugging Face Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_HUB_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret not set in GitHub settings. Skipping auto-sync."
            exit 0
          fi
          git config --global user.email "spacelab.devteam@gmail.com"
          git config --global user.name "Space Journey"
          git remote add hf https://spacejourney:$HF_TOKEN@huggingface.co/datasets/spacejourney/cdmx-sensory-impact-dataset
          git push --force hf main:main
